<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NIRAMAY Admin</title>
<style>body{font-family:Segoe UI,Arial;margin:0;background:#f5faf8;color:#15352f}header{background:#0b6b57;color:white;padding:22px 5%}main{width:92%;max-width:1200px;margin:30px auto}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:white;padding:20px;border-radius:14px;border:1px solid #dce9e5}.num{font-size:28px;font-weight:800;color:#0b6b57}.wrap{overflow:auto;margin-top:25px}table{width:100%;border-collapse:collapse;background:white}th,td{padding:13px;border-bottom:1px solid #e4eeeb;text-align:left}th{background:#eaf8f3}select{padding:7px}@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}}</style></head>
<body><header><b>NIRAMAY</b> — Diagnostic Centre Admin</header><main><div class="cards">
<div class="card"><div class="num" id="t">0</div>Total</div><div class="card"><div class="num" id="p">0</div>Pending</div><div class="card"><div class="num" id="c">0</div>Confirmed</div><div class="card"><div class="num" id="d">0</div>Completed</div></div>
<div class="wrap"><table><thead><tr><th>ID</th><th>Patient</th><th>Test</th><th>Date/Time</th><th>Collection</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></main>
<script>async function load(){let a=await(await fetch("/api/bookings")).json();t.textContent=a.length;p.textContent=a.filter(x=>x.status=="Pending").length;c.textContent=a.filter(x=>x.status=="Confirmed").length;d.textContent=a.filter(x=>x.status=="Completed").length;rows.innerHTML=a.length?a.map(x=>`<tr><td>${x.id}</td><td>${x.name}<br>${x.phone}</td><td>${x.service}</td><td>${x.date}<br>${x.time}</td><td>${x.collection||""}</td><td><select onchange="setStatus('${x.id}',this.value)">${["Pending","Confirmed","Completed","Cancelled"].map(s=>`<option ${s==x.status?"selected":""}>${s}</option>`).join("")}</select></td></tr>`).join(""):`<tr><td colspan="6">No bookings yet.</td></tr>`}async function setStatus(id,status){await fetch("/api/bookings/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status})});load()}load();setInterval(load,10000)</script></body></html>
